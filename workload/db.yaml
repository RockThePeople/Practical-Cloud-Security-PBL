apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: pbl-security
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        tier: data
    spec:
      containers:
        - name: db
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /www; echo db > /www/index.html; exec httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
          env:
            - name: PBL_ROLE
              value: database
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: pbl-security
spec:
  selector:
    app: db
  ports:
    - name: http
      port: 80
      targetPort: 80
