apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pbl-security
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /www; echo frontend > /www/index.html; exec httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
          env:
            - name: UPSTREAM_SERVICE
              value: http://backend.pbl-security.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: curl-client
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - sleep infinity
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pbl-security
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
